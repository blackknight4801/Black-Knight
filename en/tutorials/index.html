<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Black Knight - Tutorials</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./tutorials.css">
        <link rel="stylesheet" href="../../global.css">
        <link rel="icon" type="image/x-icon" href="../../images/Black-Knight/Black_Knight.png">
    </head>
    <body id="done">
        <div id="page">
            <h1>Tutorials</h1>
            <p>Want to learn something?<br>Well, you're in luck!<br><br>I have some tutorials you might be interested in!</p>
            <select id="tutorial-select" onchange="var page = document.getElementById('tutorial-select').value
            if (page === 'back1') {
                document.location.href = 'https:/' + '/blackknight4801.github.io/Black-Knight/en'
            } else if (page === 'back2') {
                document.location.href = 'https:/' + '/blackknight4801.github.io/Black-Knight/'
            } else if (page === 'javascript-base') {
                document.location.href = 'https:/' + '/www.w3schools.com/js/'
            } else if (page === 'javascript-bot') {
                document.location.href = 'https:/' + '/discord.js'
            } else {
                document.location.href = 'https:/' + '/blackknight4801.github.io/Black-Knight/en/tutorials' + page
            }
            ">
                <option disabled hidden selected>Choose a tutorial...</option>
                <optgroup label="Python">
                    <option value="python-base">[WIP] Basic Python</option>
                    <option value="python-bot">[WIP] Python Discord Bot (Disnake)</option>
                <optgroup label="JavaScript">
                    <option value="javascript-base">[EXTERNAL] Basic JavaScript</option>
                    <option value="javascript-bot">[EXTERNAL] JavaScript Discord Bot (discord.js)</option>
                </optgroup>
                <optgroup label="Back">
                    <option value="back1">Back to English Main</option>
                    <option value="back2">Back to Landpage</option>
                </optgroup>
            </select>
        </div>
    </body>
</html>
